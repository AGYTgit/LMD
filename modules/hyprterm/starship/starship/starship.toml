palette = 'catppuccin_mocha'
add_newline = false

format = """
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$rust\
$lua\
$c\
$java\
$maven\
[](fg:#86BBD8 bg:#33658A)\
[ ](fg:#33658A)
$character
"""

[character]
success_symbol = "[](#cba6f7)"
error_symbol = "[](#f38ba8)"

[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = "[ $user ]($style)"

[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 1
fish_style_pwd_dir_length = 1

[git_branch]
symbol = ""
style = "bg:#FCA17D"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#FCA17D"
format = "[$all_status$ahead_behind ]($style)"

[rust]
symbol = ""
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[lua]
symbol = "󰢱"
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[c]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[cpp]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = " "
style = "bg:#06969A"
format = "[ $symbol $context ]($style)"

[elixir]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[elm]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[gradle]
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[haskell]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[julia]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[maven]
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[nodejs]
symbol = ""
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[bun]
symbol = ""
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[nim]
symbol = "󰆥 "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[scala]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = "[ ♥ $time ]($style)"


# # Here is how you can shorten some long paths by text replacement
# # similar to mapped_locations in Oh My Posh:
# [directory.substitutions]
# "Documents" = "󰈙 "
# "Downloads" = " "
# "Music" = " "
# "Pictures" = " "
# # Keep in mind that the order matters. For example:
# # "Important Documents" = " 󰈙 "
# # will not be replaced, because "Documents" was already substituted before.
# # So either put "Important Documents" before "Documents" or use the substituted version:
# # "Important 󰈙 " = " 󰈙 "

